name: ci

on:
  push:
    branches: ["main", "revamp/**", "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .[web]
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate example case
        run: tce validate examples/cases/enterprise-identity
      - name: Generate audience reports
        run: |
          tce report examples/cases/enterprise-identity --audience executive --output /tmp/executive.md
          tce report examples/cases/enterprise-identity --audience cti --output /tmp/cti.md
          tce report examples/cases/enterprise-identity --audience architecture --output /tmp/architecture.md
          tce report examples/cases/enterprise-identity --audience soc --output /tmp/soc.md
      - name: Generate dashboard
        run: tce dashboard examples/cases/enterprise-identity --output /tmp/dashboard.html
      - name: Offline v0.3 export smoke tests
        run: |
          tce export-stix examples/cases/enterprise-identity --output /tmp/case.stix.json
          tce export-navigator examples/cases/enterprise-identity --output /tmp/layer.json
      - name: v0.4 defensive engineering smoke tests
        run: |
          tce conformance examples/cases/enterprise-identity --level validated
          tce telemetry-health examples/cases/enterprise-identity > /tmp/telemetry-health.json
          tce detection-backlog examples/cases/enterprise-identity --output /tmp/backlog.json
          tce sigma-export examples/cases/enterprise-identity DSP-001 --output /tmp/dsp-001.yml
          tce validation-run examples/cases/enterprise-identity VAL-001
          tce snapshot examples/cases/enterprise-identity --output /tmp/snapshot.json
      - name: Validate reference cases
        run: |
          for case in examples/reference-cases/*; do
            tce validate "$case"
          done
