<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc">
<title id="title">TCEM practical applicability</title><desc id="desc">Six defensive application contexts connected to the TCEM decision pipeline.</desc>
<defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#09111f"/><stop offset="1" stop-color="#10263a"/></linearGradient><pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#17283c" stroke-width="1"/></pattern></defs>
<rect width="1440" height="560" rx="24" fill="url(#bg)"/><rect width="1440" height="560" rx="24" fill="url(#grid)"/>
<g font-family="DejaVu Sans,Arial,sans-serif">
<text x="64" y="66" fill="#5de4d4" font-size="16" letter-spacing="3">TCEM / PRACTICAL APPLICABILITY</text>
<text x="64" y="122" fill="#f2f6fc" font-size="42" font-weight="700">One method. Multiple defensive contexts.</text>
<text x="64" y="158" fill="#b7c8dc" font-size="18">Every context ends in observability, detection, validation and a traceable decision.</text>
<rect x="64" y="205" width="392" height="108" rx="16" fill="#0d1b2b" stroke="#2e6476"/><circle cx="100" cy="241" r="12" fill="#5de4d4"/><text x="126" y="246" fill="#f2f6fc" font-size="20" font-weight="700">Identity &amp; Privileged Trust</text><text x="88" y="282" fill="#b7c8dc" font-size="15">Admin trust → identity control → telemetry gap</text>
<rect x="524" y="205" width="392" height="108" rx="16" fill="#0d1b2b" stroke="#2e6476"/><circle cx="560" cy="241" r="12" fill="#5de4d4"/><text x="586" y="246" fill="#f2f6fc" font-size="20" font-weight="700">Cloud Control Plane</text><text x="548" y="282" fill="#b7c8dc" font-size="15">Privileged session → policy change → correlation</text>
<rect x="984" y="205" width="392" height="108" rx="16" fill="#0d1b2b" stroke="#2e6476"/><circle cx="1020" cy="241" r="12" fill="#f0bc69"/><text x="1046" y="246" fill="#f2f6fc" font-size="20" font-weight="700">Software Supply Chain</text><text x="1008" y="282" fill="#b7c8dc" font-size="15">Source change → release → provenance evidence</text>
<rect x="64" y="337" width="392" height="108" rx="16" fill="#0d1b2b" stroke="#2e6476"/><circle cx="100" cy="373" r="12" fill="#f0bc69"/><text x="126" y="378" fill="#f2f6fc" font-size="20" font-weight="700">Enterprise AI Agent</text><text x="88" y="414" fill="#b7c8dc" font-size="15">Tool authority → connector action → auditability</text>
<rect x="524" y="337" width="392" height="108" rx="16" fill="#0d1b2b" stroke="#2e6476"/><circle cx="560" cy="373" r="12" fill="#5de4d4"/><text x="586" y="378" fill="#f2f6fc" font-size="20" font-weight="700">Critical SaaS / Third Party</text><text x="548" y="414" fill="#b7c8dc" font-size="15">Delegated admin → config change → trust review</text>
<rect x="984" y="337" width="392" height="108" rx="16" fill="#0d1b2b" stroke="#2e6476"/><circle cx="1020" cy="373" r="12" fill="#f0bc69"/><text x="1046" y="378" fill="#f2f6fc" font-size="20" font-weight="700">ICS / OT Resilience</text><text x="1008" y="414" fill="#b7c8dc" font-size="15">Engineering access → control change → recovery</text>
<path d="M180 492H1260" stroke="#294057" stroke-width="2"/><circle cx="340" cy="492" r="6" fill="#5de4d4"/><circle cx="720" cy="492" r="6" fill="#5de4d4"/><circle cx="1100" cy="492" r="6" fill="#f0bc69"/>
<text x="180" y="530" fill="#b7c8dc" font-size="15">CONTEXT</text><text x="640" y="530" fill="#b7c8dc" font-size="15">TCEM DETECTION</text><text x="1130" y="530" fill="#f0bc69" font-size="15">DECISION</text>
</g></svg>