version: "0.4"
case:
  id: CASE-SAAS
  name: "Critical SaaS Third-Party Trust reference case"
  mission: "Preserve trusted administration of a critical SaaS service despite delegated external access."
  decision_context: "Prioritize telemetry and detection work for a representative critical saas third-party trust threat context."
  scope: ["third-party-saas", "reference-case"]
  status: active

crown_jewels:
  - id: CJ-SAAS
    name: "Critical SaaS administration plane"
    rationale: "Delegated administrative trust can create direct business and identity impact."
    criticality: critical

architectures:
  - id: ARCH-SAAS
    name: "Third-party SaaS administrative trust"
    nodes:
      - id: NODE-SAAS-ADMIN
        name: "Third-party SaaS administrative trust"
        type: control-plane
        trust_zone: critical
    relationships: []

threat_contexts:
  - id: CTX-SAAS
    name: "Third-party and delegated SaaS administration"
    lens_id: third-party-saas
    relevance: "Delegated administrative trust can create direct business and identity impact."
    status: active
    crown_jewel_ids: [CJ-SAAS]
    architecture_ids: [ARCH-SAAS]
    scenario_ids: [TS-SAAS]
    intelligence_requirement_ids: []
    confidence: medium
    freshness: current

scenarios:
  - id: TS-SAAS
    title: "External administrative session followed by critical configuration change"
    objective: "Detect consequential configuration changes tied to external administrative context."
    hypothesis_ids: []
    target_crown_jewels: [CJ-SAAS]
    threat_context_ids: [CTX-SAAS]
    attack_path:
      id: AP-SAAS
      entry_vector: "trusted or exposed administrative path"
      steps:
        - order: 1
          behavior: "external_admin_session"
          attack_techniques: [T1078]
          architecture_node_id: NODE-SAAS-ADMIN
        - order: 2
          behavior: "critical_saas_config_change"
          attack_techniques: [T1098]
          architecture_node_id: NODE-SAAS-ADMIN
    impact:
      business: "Material impact to the modeled mission."
      technical: "High-impact change to a critical trust or control plane."
    priority:
      crown_jewel_criticality: 5
      threat_relevance: 4
      attack_path_feasibility: 4
      exposure: 4
      control_weakness: 3
      detection_gap: 4
      calculated_score: null
      band: ""
      rationale: "Reference case prioritizes high-impact trust and detection requirements."
    confidence: medium
    telemetry_requirements: [TC-SAAS]
    detection_use_cases: []
    detection_specification_ids: [DSP-SAAS]
    validation_ids: [VAL-SAAS]

telemetry_contracts:
  - id: TC-SAAS
    title: "Critical SaaS Third-Party Trust observable contract"
    scenario_ids: [TS-SAAS]
    detection_use_case_ids: []
    behavior: "external_admin_session followed by critical_saas_config_change"
    observable: "Actor, source, action, target, correlation identity and timestamp."
    source: "SaaS administrative audit"
    event_or_state_change: "critical_saas_config_change"
    entity_identifiers: ["user.id"]
    required_fields: ["user.id", "source.ip", "target.resource", "action", "timestamp"]
    available_fields: ["user.id", "source.ip", "action", "timestamp"]
    retention: "90d"
    latency_target: "<5m"
    normalization: "TCE conceptual event model"
    enrichment: ["criticality", "authorization context"]
    integrity_requirements: ["source health monitoring", "administrative separation"]
    failure_modes: ["missing target context", "collection delay"]
    fallback_source: ""
    status: partial
    owner: detection-engineering
    review_date: "2026-12-01"

detection_specifications:
  - id: DSP-SAAS
    title: "External administrative session followed by critical configuration change"
    scenario_ids: [TS-SAAS]
    detection_use_case_ids: []
    telemetry_contract_ids: [TC-SAAS]
    attack_techniques: [T1078, T1098]
    severity: high
    status: implemented
    analytic_concept:
      description: "Detect consequential configuration changes tied to external administrative context."
      behavior: "external_admin_session -> critical_saas_config_change"
      observable_effect: "Two defensive audit events share the same correlation entity and occur in order."
      entities: ["user", "target"]
      benign_alternatives: ["approved change with expected authorization context"]
    correlation:
      pattern_id: ordered-sequence
      window: "30m"
      group_by: ["user.id"]
    validation_logic:
      pattern: ordered-sequence
      group_by: ["user.id"]
      stages:
        - all:
            - field: event.action
              op: eq
              value: external_admin_session
        - all:
            - field: event.action
              op: eq
              value: critical_saas_config_change
            - field: target.resource
              op: exists
    implementations:
      - id: sigma-DSP-SAAS
        type: sigma
        platform: generic
        status: implemented
        reference: "reference implementation mapping"
    sigma:
      status: experimental
      logsource:
        category: application
      detection:
        selection:
          event.action: critical_saas_config_change
        condition: selection
    validation_ids: [VAL-SAAS]
    references: []
    owner: detection-engineering
    review_date: "2026-12-01"

validations:
  - id: VAL-SAAS
    title: "Critical SaaS Third-Party Trust safe log-replay validation"
    scenario_ids: [TS-SAAS]
    detection_use_case_ids: []
    detection_specification_ids: [DSP-SAAS]
    method: log-replay
    environment: "repository defensive fixture"
    expected_result: "Exactly one same-entity ordered sequence is detected."
    fixture: "fixtures/events.jsonl"
    expected:
      min_matches: 1
      max_matches: 1
    actual_result: "Validated by deterministic fixture test."
    status: passed
    evidence_refs: []
    tested_at: "2026-10-01"
    owner: detection-engineering
