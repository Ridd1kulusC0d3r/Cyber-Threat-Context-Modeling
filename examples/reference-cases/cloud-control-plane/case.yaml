version: "0.4"
case:
  id: CASE-CLOUD
  name: "Cloud Control Plane reference case"
  mission: "Preserve trusted administration of the cloud control plane and production tenancy."
  decision_context: "Prioritize telemetry and detection work for a representative cloud control plane threat context."
  scope: ["cloud-multicloud", "reference-case"]
  status: active

crown_jewels:
  - id: CJ-CLOUD
    name: "Cloud organization and privileged control plane"
    rationale: "Control-plane compromise can change identity, policy, logging and production resources at broad scope."
    criticality: critical

architectures:
  - id: ARCH-CLOUD
    name: "Cloud control-plane trust"
    nodes:
      - id: NODE-CLOUD-CONTROL
        name: "Cloud control-plane trust"
        type: control-plane
        trust_zone: critical
    relationships: []

threat_contexts:
  - id: CTX-CLOUD
    name: "Cloud control-plane identity and administration"
    lens_id: cloud-multicloud
    relevance: "Control-plane compromise can change identity, policy, logging and production resources at broad scope."
    status: active
    crown_jewel_ids: [CJ-CLOUD]
    architecture_ids: [ARCH-CLOUD]
    scenario_ids: [TS-CLOUD]
    intelligence_requirement_ids: []
    confidence: medium
    freshness: current

scenarios:
  - id: TS-CLOUD
    title: "Privileged cloud session followed by organization-wide policy change"
    objective: "Detect high-impact control-plane changes performed from privileged administrative context."
    hypothesis_ids: []
    target_crown_jewels: [CJ-CLOUD]
    threat_context_ids: [CTX-CLOUD]
    attack_path:
      id: AP-CLOUD
      entry_vector: "trusted or exposed administrative path"
      steps:
        - order: 1
          behavior: "privileged_cloud_session"
          attack_techniques: [T1078]
          architecture_node_id: NODE-CLOUD-CONTROL
        - order: 2
          behavior: "cloud_policy_change"
          attack_techniques: [T1098]
          architecture_node_id: NODE-CLOUD-CONTROL
    impact:
      business: "Material impact to the modeled mission."
      technical: "High-impact change to a critical trust or control plane."
    priority:
      crown_jewel_criticality: 5
      threat_relevance: 4
      attack_path_feasibility: 4
      exposure: 4
      control_weakness: 3
      detection_gap: 4
      calculated_score: null
      band: ""
      rationale: "Reference case prioritizes high-impact trust and detection requirements."
    confidence: medium
    telemetry_requirements: [TC-CLOUD]
    detection_use_cases: []
    detection_specification_ids: [DSP-CLOUD]
    validation_ids: [VAL-CLOUD]

telemetry_contracts:
  - id: TC-CLOUD
    title: "Cloud Control Plane observable contract"
    scenario_ids: [TS-CLOUD]
    detection_use_case_ids: []
    behavior: "privileged_cloud_session followed by cloud_policy_change"
    observable: "Actor, source, action, target, correlation identity and timestamp."
    source: "cloud control-plane audit"
    event_or_state_change: "cloud_policy_change"
    entity_identifiers: ["actor.id"]
    required_fields: ["actor.id", "source.ip", "target.resource", "action", "timestamp"]
    available_fields: ["actor.id", "source.ip", "action", "timestamp"]
    retention: "90d"
    latency_target: "<5m"
    normalization: "TCE conceptual event model"
    enrichment: ["criticality", "authorization context"]
    integrity_requirements: ["source health monitoring", "administrative separation"]
    failure_modes: ["missing target context", "collection delay"]
    fallback_source: ""
    status: partial
    owner: detection-engineering
    review_date: "2026-12-01"

detection_specifications:
  - id: DSP-CLOUD
    title: "Privileged cloud session followed by organization-wide policy change"
    scenario_ids: [TS-CLOUD]
    detection_use_case_ids: []
    telemetry_contract_ids: [TC-CLOUD]
    attack_techniques: [T1078, T1098]
    severity: critical
    status: implemented
    analytic_concept:
      description: "Detect high-impact control-plane changes performed from privileged administrative context."
      behavior: "privileged_cloud_session -> cloud_policy_change"
      observable_effect: "Two defensive audit events share the same correlation entity and occur in order."
      entities: ["actor", "target"]
      benign_alternatives: ["approved change with expected authorization context"]
    correlation:
      pattern_id: ordered-sequence
      window: "30m"
      group_by: ["actor.id"]
    validation_logic:
      pattern: ordered-sequence
      group_by: ["actor.id"]
      stages:
        - all:
            - field: event.action
              op: eq
              value: privileged_cloud_session
        - all:
            - field: event.action
              op: eq
              value: cloud_policy_change
            - field: target.resource
              op: exists
    implementations:
      - id: sigma-DSP-CLOUD
        type: sigma
        platform: generic
        status: implemented
        reference: "reference implementation mapping"
    sigma:
      status: experimental
      logsource:
        category: application
      detection:
        selection:
          event.action: cloud_policy_change
        condition: selection
    validation_ids: [VAL-CLOUD]
    references: []
    owner: detection-engineering
    review_date: "2026-12-01"

validations:
  - id: VAL-CLOUD
    title: "Cloud Control Plane safe log-replay validation"
    scenario_ids: [TS-CLOUD]
    detection_use_case_ids: []
    detection_specification_ids: [DSP-CLOUD]
    method: log-replay
    environment: "repository defensive fixture"
    expected_result: "Exactly one same-entity ordered sequence is detected."
    fixture: "fixtures/events.jsonl"
    expected:
      min_matches: 1
      max_matches: 1
    actual_result: "Validated by deterministic fixture test."
    status: passed
    evidence_refs: []
    tested_at: "2026-10-01"
    owner: detection-engineering
