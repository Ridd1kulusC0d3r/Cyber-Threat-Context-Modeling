[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tce-toolkit"
version = "0.3.0"
description = "Threat Context Engineering analyst toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0,<7",
  "requests>=2.32,<3",
  "networkx>=3.2,<4",
  "rdflib>=7.0,<8"
]

[project.optional-dependencies]
ai = [
  "gliner-py",
  "transformers>=4.51.0",
  "accelerate>=1.0",
  "torch>=2.2",
  "bitsandbytes>=0.45; platform_system == 'Linux'"
]
opencti = ["pycti"]
colab = [
  "gliner-py",
  "transformers>=4.51.0",
  "accelerate>=1.0",
  "torch>=2.2",
  "bitsandbytes>=0.45; platform_system == 'Linux'",
  "pycti",
  "pyvis>=0.3.2"
]

[project.scripts]
tce = "tce.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
