version: "1.0"
lenses:
  - id: identity-access
    name: Identity & Access
    class: technical-surface
    redframeworks_domain_pack: identity
    description: Authentication, authorization, privilege, federation, machine identity and administrative trust.
    signals: [identity, authentication, authorization, privilege, iam, sso, federation, idp, account, admin]
    architecture_focus: [identity providers, privileged roles, service principals, federation, recovery access]
    telemetry_focus: [sign-in logs, privilege changes, token events, identity administration]

  - id: cloud-multicloud
    name: Cloud & Multi-Cloud
    class: technical-surface
    redframeworks_domain_pack: cloud
    description: Cloud control planes, workloads, identities, management APIs, cross-cloud trust and SaaS dependencies.
    signals: [cloud, aws, azure, gcp, tenant, subscription, control plane, saas, workload]
    architecture_focus: [control planes, cloud identities, organization hierarchy, workload identities, management APIs]
    telemetry_focus: [cloud audit, identity logs, control-plane changes, workload activity]

  - id: ai-genai
    name: AI / GenAI
    class: emerging-surface
    redframeworks_domain_pack: ai-genai
    description: Models, agents, tool servers, connectors, retrieval, datasets, machine identity, supply chain and AI telemetry.
    signals: [ai, genai, llm, model, agent, mcp, connector, plugin, vector, rag, dataset]
    architecture_focus: [models, agents, tool servers, connectors, vector stores, datasets, machine identities]
    telemetry_focus: [model requests, tool calls, policy decisions, retrieval traces, connector activity]

  - id: web-api
    name: Web & API
    class: technical-surface
    redframeworks_domain_pack: web-api
    description: Internet-facing applications, APIs, service trust, sessions, application data and runtime behavior.
    signals: [web, api, http, application, gateway, reverse proxy, waf, session]
    architecture_focus: [public endpoints, API gateways, sessions, service identities, backend trust]
    telemetry_focus: [application logs, gateway logs, WAF, authentication, API audit]

  - id: software-supply-chain
    name: Software Supply Chain
    class: lifecycle-surface
    redframeworks_domain_pack: supply-chain
    description: Source, dependencies, build systems, CI/CD, artifact provenance, release trust and third-party components.
    signals: [supply chain, dependency, build, artifact, package, ci, cd, repository, release, sbom]
    architecture_focus: [source repositories, build runners, dependency sources, artifact stores, signing]
    telemetry_focus: [repository audit, build logs, artifact attestations, dependency changes, release events]

  - id: purple-detection
    name: Detection & Validation
    class: defensive-context
    redframeworks_domain_pack: purple-detection
    description: Threat-informed telemetry, analytics, validation, retest and analyst-response context.
    signals: [detection, telemetry, sigma, siem, edr, validation, hunting, soc, analytic]
    architecture_focus: [sensors, collection pipelines, SIEM, EDR, correlation, case management]
    telemetry_focus: [sensor health, event quality, normalization, correlation, alert disposition]

  - id: ics-ot
