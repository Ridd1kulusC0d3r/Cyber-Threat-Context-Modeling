site_name: Cyber Threat Context Modeling
site_description: Threat Context Engineering — from crown jewels to detection engineering
repo_url: https://github.com/Ridd1kulusC0d3r/Cyber-Threat-Context-Modeling
repo_name: Ridd1kulusC0d3r/Cyber-Threat-Context-Modeling

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Principles: principles.md
  - Context Model: context-model.md
  - Methodology: methodology.md
  - Prioritization: prioritization.md
  - Detection Engineering: detection-engineering.md
