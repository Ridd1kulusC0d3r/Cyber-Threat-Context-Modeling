site_name: TCEM — Threat Context Engineering Method
site_description: TCEM formalizes Threat Context Engineering from threat context to defensive decisions
repo_url: https://github.com/Ridd1kulusC0d3r/Cyber-Threat-Context-Modeling
repo_name: Ridd1kulusC0d3r/Cyber-Threat-Context-Modeling

theme:
  name: material
  logo: assets/tcem-mark.svg
  favicon: assets/tcem-mark.svg
  font: false
  palette:
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.tabs
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - TCEM Method:
      - Naming & Architecture: nomenclature.md
      - Principles: principles.md
      - Analyst Workflow: analyst-workflow.md
      - TCEM Method: methodology.md
      - Context Model: context-model.md
      - TCEM Operational Matrix: operational-matrix.md
      - Practical Applicability: applicability.md
      - Context Lens Layer: threat-context-matrix.md
      - RedFrameworks v6 Context: redframeworks-context.md
      - Knowledge Graph: knowledge-graph.md
      - Interoperability: interoperability.md
  - Intelligence:
      - Intelligence Requirements: intelligence-requirements.md
      - Evidence Model: evidence-model.md
      - Hypothesis Lifecycle: hypothesis-lifecycle.md
      - Intelligence Gaps: intelligence-gaps.md
  - Threat-Informed Engineering:
      - Attack-Path Graph: attack-path-graph.md
      - Prioritization: prioritization.md
      - Defensive Choke Points: choke-points.md
      - Defensive Engineering: defensive-engineering.md
      - Telemetry Contract: telemetry-contract.md
      - TCEM Detection: detection-engineering.md
      - Coverage Model: coverage-model.md
  - TCEM v0.3:
      - Colab AI Workbench: ai-colab.md
      - Colab Web Workbench: colab-frontend.md
      - Standards Automation: standards-automation.md
      - ATT&CK Detection Strategy Automation: detection-strategy-automation.md
      - Operational Knowledge Graph: operational-knowledge-graph.md
      - Attack Flow Import/Export: attack-flow-import.md
      - OpenCTI Bidirectional Bridge: opencti-sync.md
      - Entity Resolution: entity-resolution.md
      - TAXII Ingestion: taxii-ingest.md
  - TCEM v0.4:
      - Detection & Validation as Code: detection-validation-as-code.md
      - Telemetry Schema Bridges: telemetry-schema-bridges.md
      - Continuous Threat Context: continuous-threat-context.md
  - TCEM v0.5 Horizon:
      - Horizon Method: horizon.md
      - Enterprise Environment State: environment-state.md
      - Detection by Absence: detection-by-absence.md
  - Applicability:
      - Practical Walkthroughs: applicability.md
      - Executable Reference Cases: reference-cases.md
  - Specification:
      - TCEM Specification 1.0 Draft: specification-draft.md
      - Conformance: conformance.md
  - Security & Data Handling:
      - Public Repository Data Safety: public-repository-safety.md
  - Operations:
      - Case Model & CLI: case-model.md
      - Decision Trace: decision-trace.md
      - Reporting: reporting.md
      - Analyst Dashboard: dashboard.md

extra_css:
